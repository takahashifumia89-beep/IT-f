name = "it-forum-official"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

# Статика (React сайты) — vite build нәтижесі
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Тек /api/* сұраныстары Worker арқылы өтеді, қалғанын Cloudflare тікелей береді
run_worker_first = ["/api/*"]

# SQLite базасы (Cloudflare D1).
# database_id-ді `wrangler d1 create it-forum-db` командасы шығарады — соны қойыңыз.
[[d1_databases]]
binding = "DB"
database_name = "it-forum-db"
database_id = "ee6ccbc6-a0e6-4354-b447-4f119779c0ad"

# ҚҰПИЯ КІЛТТЕР мұнда ЖАЗЫЛМАЙДЫ. Олар Cloudflare Secrets-те сақталады:
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
